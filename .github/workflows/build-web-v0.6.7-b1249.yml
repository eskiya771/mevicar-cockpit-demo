name: Build MeviCar Next Web v0.6.7 B1249
on:
  push:
    branches: [release/web-v0.6.7-b1249]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate shared navigation code syntax
        run: |
          node --check navigation-google.js
          node --check navigation-shared-core.js
          node --check navigation-android-provider.js
          node --check nav-web-parity.js
          node --check nav-dashboard.js
          node --check nav-trip.js
          node --check nav-route-details.js
      - name: Build versioned Web and offline bundle
        run: python3 release-src/build-release.py
      - name: Test build 1249 navigation compatibility and metadata
        run: node release-src/qa-navigation.mjs
      - name: Commit verified v0.6.7 artifacts to release branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html build-info.json proxy-release.json offline-bundle.json offline-bundle.zip sw.js
          git diff --cached --stat
          git diff --cached --quiet && { echo "No release artifacts updated"; exit 1; }
          git commit -m "build(web): v0.6.7 B1249 from mevicar-next@58cd48d"
          git push origin HEAD:release/web-v0.6.7-b1249
