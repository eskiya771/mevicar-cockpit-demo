services:
  mevitv-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: mevitv-bridge:local
    container_name: mevitv-bridge
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      NODE_ENV: production
    ports:
      - "127.0.0.1:8787:8787"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    volumes:
      - ./runtime:/runtime:rw
    tmpfs:
      - /tmp:size=16m
    pids_limit: 100
    mem_limit: 256m
