name: Protect Web release from outdated build rollback
on:
  push:
    branches: [main]
    paths:
      - 'build-info.json'
permissions:
  contents: write
concurrency:
  group: web-release-rollback-guard
  cancel-in-progress: false
jobs:
  restore-on-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Reject stale public builds and restore preceding release
        shell: bash
        run: |
          set -euo pipefail
          previous="$(git show HEAD^:build-info.json | python3 -c 'import json,sys; print(int(json.load(sys.stdin)["build"]))')"
          current="$(python3 -c 'import json; print(int(json.load(open("build-info.json"))["build"]))')"
          echo "Published build: $current; previous build: $previous"
          if (( current >= previous )); then
            exit 0
          fi
          echo "::warning::Outdated Web build $current would replace $previous. Restoring preceding release."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert --no-edit HEAD
          git push origin HEAD:main
