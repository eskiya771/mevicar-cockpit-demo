<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#080d17"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>MeviCar Cockpit Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#070c15;color:#eef8ff;font:16px system-ui}main{height:100dvh;display:flex;overflow:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}nav{width:88px;background:#0b1626;display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;border-right:1px solid #355}button{border:1px solid #335d70;background:#112537;color:white;border-radius:17px;padding:15px;min-height:54px;font-size:16px}nav button{width:70px;font-size:12px;padding:10px}section{flex:1;position:relative;overflow:hidden;background:radial-gradient(ellipse at 75% 25%,#1a3548,#0b1b29 70%)}.roads{position:absolute;inset:0;width:100%;height:100%;opacity:.65}.panel{position:absolute;top:16px;left:16px;bottom:16px;width:min(370px,57%);background:#142335eb;backdrop-filter:blur(16px);border:1px solid #446273;border-radius:24px;padding:16px;overflow:auto;box-shadow:0 12px 35px #0007}h2{margin:5px 0 18px;font-size:22px}input{width:100%;border:1px solid #3b6073;background:#071727;color:white;border-radius:15px;font-size:19px;padding:14px}article{padding:16px 5px;border-bottom:1px solid #38505c;cursor:pointer}small{color:#9cb6c7}.keyboard{position:absolute;bottom:8px;left:10px;right:10px;background:#1b2c3be8;border-radius:18px;padding:10px;display:none}.keyboard.show{display:block}.keys{display:flex;justify-content:center;gap:4px;margin:4px}.keys button{flex:1;padding:5px;min-height:43px;border-radius:9px}.banner{position:absolute;top:15px;right:15px;background:#152a3c;border:1px solid #456;border-radius:18px;padding:18px;max-width:40%}.hidden{display:none}.pill{border-radius:25px;margin:6px 4px 6px 0}.maplabel{position:absolute;right:14%;top:45%;color:#8eb5c7;font-size:26px;font-weight:700}.hint{position:absolute;right:20px;bottom:20px;font-size:12px;color:#9fb5c3}@media(max-width:680px){nav{width:66px}nav button{width:58px;padding:7px;font-size:10px}.panel{width:min(330px,68%);padding:10px}.keys button{min-height:37px;font-size:13px;padding:3px}.banner{font-size:12px;padding:9px}}</style></head><body><main><nav><button onclick="showNav()">🧭<br>Navi</button><button onclick="showApp('Audio')">♫<br>Audio</button><button onclick="showApp('Telefon')">☎<br>Telefon</button><button onclick="showApp('Tacho')">◉<br>Tacho</button><button onclick="showApp('Wetter')">☁<br>Wetter</button><button onclick="showApp('Apps')">▦<br>Apps</button></nav><section id="view"><svg class="roads" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice"><path d="M-100 300L1100 300M430 -100L430 700M-100 540L1100 60M100 -100L840 700M800 -100L900 700" fill="none" stroke="#38616e" stroke-width="30"/><path d="M-100 300L1100 300M430 -100L430 700M-100 540L1100 60M100 -100L840 700M800 -100L900 700" fill="none" stroke="#172f42" stroke-width="24"/></svg><div class="maplabel">MeviCar Next</div><div class="panel" id="panel"><h2 id="title">Apple-Karten-Stil</h2><input id="search" placeholder="Ziel suchen" inputmode="none" autocomplete="off" onclick="keyboard(true)" oninput="results()"><div id="results"><article onclick="select('Privat')">⌂ &nbsp; Privat</article><article onclick="select('Arbeit')">▣ &nbsp; Arbeit</article><article onclick="select('Gymnasium')">★ &nbsp; Gymnasium</article><article onclick="select('Erlangen')">◉ &nbsp; Erlangen</article><article onclick="select('Adelsdorf')">◉ &nbsp; Adelsdorf</article></div><div id="actions"></div></div><div class="banner hidden" id="banner"></div><div class="keyboard" id="keyboard"><div class="keys" id="r1"></div><div class="keys" id="r2"></div><div class="keys" id="r3"></div><div class="keys"><button onclick="key(' ')">Leerzeichen</button><button onclick="key('BACK')">⌫</button><button onclick="keyboard(false)">Fertig</button></div></div><div class="hint">Cockpit Lab · Web-Demo</div></section></main><script>let dest='',route=false;const $=id=>document.getElementById(id);function keyboard(v){$('keyboard').classList.toggle('show',v);$('panel').style.bottom=v?'205px':'16px'}function key(k){let e=$('search');e.value=k==='BACK'?e.value.slice(0,-1):e.value+k;results()}function results(){let q=$('search').value.trim();$('results').innerHTML=(q?[q,q+' Zentrum',q+' Bahnhof',q+' Nord']:['Privat','Arbeit','Gymnasium','Erlangen','Adelsdorf']).map(x=>'<article onclick="select('+JSON.stringify(x).replace(/"/g,'&quot;')+')">⌕ &nbsp; '+x+'</article>').join('')}function select(x){dest=x;keyboard(false);$('title').textContent='Routenvorschau';$('results').innerHTML='<article>📍 '+x+'</article><article>🚗 Schnellste Route · 24 min (Demo)</article>';$('actions').innerHTML='<button onclick="start()">Los</button> <button onclick="showNav()">Zurück</button>'}function start(){route=true;$('panel').classList.add('hidden');$('banner').classList.remove('hidden');$('banner').innerHTML='↱ &nbsp; Route nach '+dest+'<br><small>Navigation simuliert</small><br><button onclick="stop()">Route beenden</button>'}function stop(){route=false;$('banner').classList.add('hidden');showNav()}function showNav(){$('panel').classList.remove('hidden');$('title').textContent='Apple-Karten-Stil';$('search').value='';$('actions').innerHTML='';results();keyboard(false)}function showApp(a){keyboard(false);$('panel').classList.remove('hidden');$('title').textContent=a;$('results').innerHTML=a==='Apps'?['Wetter','Home Assistant','OBD','WhatsApp','YouTube','Teams','Fahrtenbuch','Kalender','Aktienkurse','Einstellungen'].map(x=>'<article onclick="showApp(\''+x+'\')">'+x+'</article>').join(''):'<article>'+a+' · interaktive Cockpit-Demo</article>';$('actions').innerHTML='<button onclick="showNav()">Zur Navigation</button>'}for(let [id,letters] of [['r1','QWERTZUIOP'],['r2','ASDFGHJKL'],['r3','YXCVBNM']])$(id).innerHTML=[...letters].map(k=>'<button onclick="key(\''+k+'\')">'+k+'</button>').join('');$('results').addEventListener('touchmove',()=>keyboard(false),{passive:true});</script></body></html>
