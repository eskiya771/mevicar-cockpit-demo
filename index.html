null,operator:null,fresh:false};function calcPress(k){let a=calcState;if(k==='C'){a.display='0';a.stored=null;a.operator=null;a.fresh=false}else if(k==='⌫'){a.display=a.display.length>1?a.display.slice(0,-1):'0';if(a.display==='-'||a.display==='')a.display='0'}else if(k==='±'){if(a.display!=='0')a.display=a.display.startsWith('-')?a.display.slice(1):'-'+a.display}else if(k==='%'){a.display=String(Number(a.display)/100)}else if('0123456789.'.includes(k)&&k.length===1){if(a.fresh){a.display='0';a.fresh=false}if(k==='.'&&a.display.includes('.'))return;if(a.display.replace(/[^0-9]/g,'').length>=12)return;a.display=k==='.'?a.display+'.':a.display==='0'?k:a.display+k}else if(['+','−','×','÷','='].includes(k)){let v=Number(a.display);if(a.operator!==null&&a.stored!==null&&!a.fresh){let n=a.operator==='+'?a.stored+v:a.operator==='−'?a.stored-v:a.operator==='×'?a.stored*v:v===0?NaN:a.stored/v;if(!Number.isFinite(n)){a.display='Fehler';a.stored=null;a.operator=null;a.fresh=true;render();return}a.display=String(Number(n.toPrecision(11)));v=Number(a.display)}a.stored=k==='='?null:v;a.operator=k==='='?null:k;a.fresh=true}render()}function calcHTML(){const keys=['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','='];return '<div class="calculator-layout"><div class="calculator-display" aria-live="polite">'+esc(calcState.display)+'</div><div class="calculator-keys">'+keys.map(k=>'<button type="button" onclick="calcPress(\''+k+'\')">'+k+'</button>').join('')+'</div></div>'}
function openApp(id){if(id==='slot')id=s.extra||'apps';if(id==='nav'){s.app='nav';s.mode='map';s.keyboard=false;render();return}if(s.app===id){s.mode=s.mode==='full'?'split':'full'}else{const wasSplit=s.mode==='split';s.app=id;s.mode=wasSplit?'split':'full'}if(extras.some(x=>x[0]===id))s.extra=id;s.keyboard=false;render()}function launch(id){const wasSplit=s.mode==='split';s.extra=id;s.app=id;s.mode=wasSplit?'split':'full';s.keyboard=false;render()}function openSearch(){s.app='nav';s.mode='map';s.nav='search';s.keyboard=true;s.query='';render();setTimeout(()=>{const e=$('searchInput');if(e)e.focus({preventScroll:true})},0)}function updateQuery(v){s.query=v;const e=$('suggestions');if(e)e.innerHTML=resultsHTML()}function key(k){s.query=k==='back'?s.query.slice(0,-1):k==='space'?s.query+' ':s.query+k.toLowerCase();const e=$('searchInput');if(e){e.value=s.query;e.focus({preventScroll:true})}updateQuery(s.query)}function hideKeyboard(){s.keyboard=false;render()}function showKeyboard(){s.keyboard=true;render();setTimeout(()=>{$('searchInput')?.focus({preventScroll:true})},0)}function selectPlace(name){s.destination=name;s.query=name;s.nav='preview';s.keyboard=false;s.mode='map';render()}function startRoute(){s.route=true;s.nav='driving';s.mode='map';s.app='nav';s.recents=[s.destination,...s.recents.filter(x=>x!==s.destination)].slice(0,7);render()}function stopRoute(){s.route=false;s.nav='browse';s.mode='map';s.app='nav';s.destination='';render()}function backToBrowse(){s.nav='browse';s.keyboard=false;s.mode='map';render()}function toggleFav(){s.favorites=s.favorites.includes(s.destination)?s.favorites.filter(x=>x!==s.destination):[...s.favorites,s.destination];render()}function startCall(){s.returnApp=s.app;s.returnMode=s.mode;s.call='ring';s.app='phone';s.mode='split';render()}function endCall(){s.call='idle';s.app=s.returnApp;s.mode=s.returnMode;render()}function btn(text,action,cls=''){return `<button class="${cls}" onclick="${action}">${text}</button>`}function placeButton(name,sub,icon='⌖'){return `<button class="suggestion" onclick="selectPlace(decodeURIComponent('${encodeURIComponent(name)}'))"><span class="circle">${icon}</span><span><strong>${esc(name)}</strong><small>${esc(sub)}</small></span><span style="margin-left:auto">›</span></button>`}function resultsHTML(){const q=s.query.trim().toLocaleLowerCase('de');let items=q?places.filter(p=>p.join(' ').toLocaleLowerCase('de').includes(q)):places.slice(0,5);if(q&&!items.length)items=[[s.query,'Freie Zieleingabe · Demo']];return items.map(p=>placeButton(p[0],p[1])).join('')}function favHTML(){const icons=['⌂','▣','♜','▥'];return `<div class="favs">${s.favorites.map((f,i)=>`<button class="fav" onclick="selectPlace(decodeURIComponent('${encodeURIComponent(f)}'))"><span class="bubble">${icons[i%icons.length]}</span><span>${esc(f)}</span></button>`).join('')}</div>`}function keyboardHTML(){return `<div class="keyboard">${['QWERTZUIOP','ASDFGHJKL','YXCVBNM'].map(line=>`<div class="keyrow">${[...line].map(k=>btn(k,`key('${k}')`)).join('')}</div>`).join('')}<div class="keyrow">${btn('123',`key('1')`,'special')}${btn('Leerzeichen',`key('space')`,'special')}${btn('⌫',`key('back')`,'special')}${btn('Fertig',`hideKeyboard()`,'go')}</div></div>`}function browseOverlay(){return `<div class="overlay glass"><div class="inner"><button class="searchbox" style="text-align:left;width:100%" onclick="openSearch()"><span style="font-size:24px">⌕</span><span style="color:#d0e2e5;font-size:17px;flex:1">Apple-Karten-Stil · Suchen</span><span style="font-size:22px">🎙</span></button><div class="sectiontitle">Vorschläge</div>${placeButton(s.recents[0]||'Erlangen-Nord','Zuletzt angesehen','📍')}<div class="sectiontitle">Orte ›</div>${favHTML()}<div class="sectiontitle">Letzte Ziele</div><div class="list">${s.recents.map(n=>placeButton(n,'Zuletzt verwendet','◷')).join('')}</div></div></div>`}function searchOverlay(){return `<div class="overlay glass"><div class="inner"><div class="row"><b style="font-size:17px">Suchen</b>${btn(toolIcon('back','Zurück'),'backToBrowse()','tool-control')}</div><div class="searchbox"><span style="font-size:23px">⌕</span><input id="searchInput" readonly inputmode="none" autocomplete="off" aria-label="Adresse suchen" placeholder="Ort oder Adresse" value="${esc(s.query)}" onclick="if(!s.keyboard)showKeyboard()"><button class="iconbtn" onclick="s.query='';updateQuery('');$('searchInput').value='';showKeyboard()">×</button></div><div class="row"><b>Suchvorschläge</b><span class="small">Zum Scrollen wischen ↓</span></div><div id="suggestions" class="list" ontouchmove="scrollResults()" onwheel="scrollResults()" onscroll="scrollResults()">${resultsHTML()}</div></div></div>${s.keyboard?keyboardHTML():''}`}
document.addEventListener('keydown',e=>{if(s.nav!=='search'||s.app!=='nav'||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='Backspace'){e.preventDefault();key('back')}else if(e.key===' '){e.preventDefault();key('space')}else if(e.key.length===1){e.preventDefault();key(e.key)}else if(e.key==='Escape'){hideKeyboard()}else if(e.key==='Enter'&&s.query.trim()){selectPlace(s.query)}});function scrollResults(){if(s.keyboard){s.keyboard=false;const k=document.querySelector('.keyboard');if(k)k.remove();const m=document.querySelector('.map');m?.classList.remove('searchmode')}}function previewHTML(){return `<div class="preview glass"><div class="row"><b style="font-size:18px">${esc(s.destination)}</b>${btn(toolIcon('close','Schließen'),'backToBrowse()','tool-control close-control')}</div><span class="small">Routenvorschau · simulierte Zeiten</span>${[0,1].map((n)=>btn(`<span>${n===0?'Schnellste Route':'Alternative Route'}</span><b>${n===0?'24':'29'} Min.</b>`,`s.routeChoice=${n};render()`,`routeopt ${s.routeChoice===n?'active':''}`)).join('')}<div class="row">${btn(s.favorites.includes(s.destination)?'★ Gespeichert':'☆ Favorit','toggleFav()')}${btn('➤ Los','startRoute()','primary')}</div></div>`}function roads(){return `<svg class="roads" viewBox="0 0 1000 650" preserveAspectRatio="xMidYMid slice"><path class="park" d="M560 410L780 355 960 480 950 650 610 650Z"/><path class="park" d="M0 0L330 0 260 170 0 230Z"/><path class="water" d="M600 480L700 430 750 560 660 615Z"/><path class="street" d="M-50 180Q220 210 400 80T1100 120 M-20 360Q250 300 460 410T1100 350 M140 -20Q260 210 190 680 M430 -30Q500 280 590 700 M810 -30Q700 270 960 680"/><path class="street2" d="M-10 90L900 600 M70 650L700 -50 M320 650L900 -50 M0 500L1050 180 M300 -30L1000 450 M0 260L1000 480 M80 -30L580 680 M700 -20L1000 230"/>${s.nav==='preview'||s.nav==='driving'?'<path class="route" d="M710 375L640 345 570 420 455 360 330 390 250 265"/><circle class="pin" cx="250" cy="265" r="12"/>':''}</svg>`}function mapHTML(){const search=s.nav==='search',driving=s.nav==='driving';return `<div class="map ${search&&s.keyboard?'searchmode':''}">${roads()}<span class="map-label">Erlangen · Demo-Karte</span><div class="loc"></div><div class="map-tools">${btn(toolIcon('locate','Position'),'render()','tool-control map-control')}${btn(toolIcon('heading','Ausrichtung'),'render()','tool-control map-control')}</div><div class="map-weather">☾ 4°</div><div class="map-badge">◉ GPS · DEMO</div>${s.app==='nav'?(s.nav==='browse'?browseOverlay():search?searchOverlay():s.nav==='preview'?previewHTML():`<div class="navbanner"><div class="small">IN 850 M</div><strong>↱ Rechts abbiegen</strong><div>${esc(s.destination)}</div><div class="controls" style="margin-top:12px">${btn('Route beenden','stopRoute()')}${btn('Zusatzscreen','s.mode="split";render()','primary')}${btn('Neues Ziel','openSearch()')}</div></div>`):''}</div>`}

const gpsData={watch:null,active:false,speed:0,accuracy:null,altitude:null,course:null,heading:null,lastFix:null,error:'GPS noch nicht gestartet'};
function gpsStart(){if(!navigator.geolocation){gpsData.error='GPS wird vom Browser nicht unterstützt';gpsRefresh();return}if(gpsData.watch!==null)return;gpsData.error='Warte auf GPS-Freigabe …';gpsData.active=true;gpsData.watch=navigator.geolocation.watchPosition(p=>{const q=p.coords;gpsData.speed=q.speed===null?0:Math.max(0,q.speed*3.6);gpsData.accuracy=q.accuracy;gpsData.altitude=q.altitude;gpsData.course=q.heading;gpsData.lastFix=Date.now();gpsData.error='GPS aktiv';gpsRefresh()},e=>{gpsData.error=e.code===1?'Standortzugriff verweigert':e.code===2?'Standort nicht verfügbar':'GPS-Zeitüberschreitung';gpsData.active=false;if(gpsData.watch!==null){navigator.geolocation.clearWatch(gpsData.watch);gpsData.watch=null}gpsRefresh()},{enableHighAccuracy:true,maximumAge:1000,timeout:15000});gpsRefresh()}
function gpsStop(){if(gpsData.watch!==null)navigator.geolocation.clearWatch(gpsData.watch);gpsData.watch=null;gpsData.active=false;gpsData.error='GPS gestoppt';gpsRefresh()}
async function compassStart(){if(!('DeviceOrientationEvent' in window)){gpsData.error='Kompasssensor nicht verfügbar';gpsRefresh();return}try{if(typeof DeviceOrientationEvent.requestPermission==='function'){const perm=await DeviceOrientationEvent.requestPermission();if(perm!=='granted'){gpsData.error='Kompassfreigabe verweigert';gpsRefresh();return}}window.addEventListener('deviceorientation',compassOrientation,true);gpsData.error='Kompass aktiviert';gpsRefresh()}catch(e){gpsData.error='Kompassfreigabe fehlgeschlagen';gpsRefresh()}}
function compassOrientation(e){if(typeof e.webkitCompassHeading==='number')gpsData.heading=e.webkitCompassHeading;else if(e.absolute&&typeof e.alpha==='number')gpsData.heading=(360-e.alpha)%360;gpsRefresh()}
function gpsRefresh(){const speed=document.getElementById('gpsSpeed'),needle=document.getElementById('gpsNeedle'),rot=document.getElementById('gpsCompassRot'),heading=document.getElementById('gpsHeading'),status=document.getElementById('gpsStatus'),meta=document.getElementById('gpsMeta');if(!speed)return;speed.textContent=Math.round(gpsData.speed);if(needle)needle.setAttribute('transform','rotate('+(-120+Math.min(gpsData.speed,220)/220*240)+' 120 120)');const h=gpsData.heading??gpsData.course;if(rot&&h!==null)rot.setAttribute('transform','rotate('+(-h)+' 120 120)');if(heading)heading.textContent=h===null?'Richtung unbekannt':Math.round(h)+'° · '+(['N','NO','O','SO','S','SW','W','NW'][Math.round(h/45)%8]);if(status)status.textContent=gpsData.error;if(meta)meta.textContent='GPS ±'+(gpsData.accuracy===null?'–':Math.round(gpsData.accuracy))+' m  ·  Höhe '+(gpsData.altitude===null?'–':Math.round(gpsData.altitude))+' m'}
function gpsSpeedOnly(){return '<div class="gpsdash gps-speed-only"><section class="gpspanel"><div class="gpsdial"><svg viewBox="0 0 240 240" aria-label="GPS-Tachometer 0 bis 220 km/h"><defs><linearGradient id="gpsArcOnly" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12e4ff"/><stop offset="1" stop-color="#8a4cff"/></linearGradient></defs><circle cx="120" cy="120" r="112" fill="#081725" stroke="#32647d" stroke-width="2"/><circle cx="120" cy="120" r="102" fill="none" stroke="url(#gpsArcOnly)" stroke-width="4" stroke-dasharray="430 220" transform="rotate(150 120 120)"/>'+Array.from({length:12},(_,i)=>{const v=i*20,a=(-120+v/220*240)*Math.PI/180;return '<text x="'+(120+93*Math.sin(a)).toFixed(1)+'" y="'+(120-93*Math.cos(a)).toFixed(1)+'" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#a5d4e6">'+v+'</text>'}).join('')+'<g id="gpsNeedle" transform="rotate(-120 120 120)"><path d="M120 135 L116 120 L120 37 L124 120 Z" fill="#40edff"/><circle cx="120" cy="120" r="7" fill="#a6f7ff"/></g></svg><div class="gpsreadout" id="gpsSpeed">0<small>km/h · GPS</small></div></div><div class="gpsmeta" id="gpsMeta">GPS ±– m · Höhe – m</div><div id="gpsStatus" class="gpsstatus">GPS noch nicht gestartet</div><div class="gpsactions"><button onclick="gpsStart()">◎ GPS starten</button><button onclick="gpsStop()">■ Stop</button></div></section></div>'}
function gpsDashboard(){const marks=Array.from({length:12},(_,i)=>{const v=i*20,a=(-120+v/220*240)*Math.PI/180,x=120+93*Math.sin(a),y=120-93*Math.cos(a);return '<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#a5d4e6">'+v+'</text>'}).join('');return '<div class="gpsdash"><section class="gpspanel"><div class="gpsdial"><svg viewBox="0 0 240 240" aria-label="Tachometer 0 bis 220 km/h"><defs><linearGradient id="gpsArc" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12e4ff"/><stop offset="1" stop-color="#8a4cff"/></linearGradient></defs><circle cx="120" cy="120" r="112" fill="#081725" stroke="#32647d" stroke-width="2"/><circle cx="120" cy="120" r="102" fill="none" stroke="url(#gpsArc)" stroke-width="4" stroke-dasharray="430 220" transform="rotate(150 120 120)"/>'+marks+'<g id="gpsNeedle" transform="rotate(-120 120 120)"><path d="M120 135 L116 120 L120 37 L124 120 Z" fill="#40edff"/><circle cx="120" cy="120" r="7" fill="#a6f7ff"/></g></svg><div class="gpsreadout" id="gpsSpeed">0<small>km/h · GPS</small></div></div><div class="gpsmeta" id="gpsMeta">GPS ±– m · Höhe – m</div><div class="gpsactions"><button onclick="gpsStart()">◎ GPS starten</button><button onclick="gpsStop()">■ Stop</button></div></section><section class="gpspanel"><div class="gpscompass"><svg viewBox="0 0 240 240" aria-label="Kompass"><circle cx="120" cy="120" r="108" fill="#091c2b" stroke="#36738a" stroke-width="3"/><g id="gpsCompassRot"><text x="120" y="32" text-anchor="middle" fill="#51e9ff" font-size="24" font-weight="bold">N</text><text x="120" y="219" text-anchor="middle" fill="#b4cad8" font-size="21">S</text><text x="214" y="127" text-anchor="middle" fill="#b4cad8" font-size="21">O</text><text x="26" y="127" text-anchor="middle" fill="#b4cad8" font-size="21">W</text></g><path d="M120 46 L105 125 L120 113 L135 125 Z" fill="#25d9fa"/><path d="M120 194 L105 125 L120 137 L135 125 Z" fill="#7b94aa"/><circle cx="120" cy="125" r="7" fill="#dffbff"/></svg></div><div id="gpsHeading" class="gpscompasslabel">Richtung unbekannt</div><div class="gpsactions"><button onclick="compassStart()">◇ Kompass aktivieren</button></div><div id="gpsStatus" class="gpsstatus">GPS noch nicht gestartet</div></section></div>'}

function settingsHTML(){const themes=[{id:'default',name:'Original',description:'Aktueller Cockpit-Look'},{id:'cyberpunk',name:'Neon City',description:'Magenta · große Icons'},{id:'liquidglass',name:'Liquid Glass',description:'Glas · weiches Licht'}];return `<div class="settings-ui"><div class="settings-heading"><div><h2>Design &amp; Anzeige</h2><p>Wähle deinen MeviCar-Next-Look. Änderungen sind sofort sichtbar.</p></div><span class="settings-version">v${CURRENT_BUILD.version} · Build ${CURRENT_BUILD.build}</span></div><div class="theme-options" role="group" aria-label="Design auswählen">${themes.map(t=>`<button type="button" class="theme-card ${s.theme===t.id?'selected':''}" aria-pressed="${s.theme===t.id}" onclick="setTheme('${t.id}')"><span class="theme-visual theme-visual-${t.id}" aria-hidden="true"><span class="theme-mini-dock"><i></i><i></i><i></i></span><span class="theme-mini-screen"><b></b><b></b><b></b></span></span><span class="theme-name">${t.name}</span><span class="theme-description">${t.description}</span><span class="theme-check">${s.theme===t.id?'✓ Aktiv':'Auswählen'}</span></button>`).join('')}</div><div class="settings-bottom"><span class="small">Deine Auswahl wird auf diesem Gerät gespeichert.</span>${btn('📋 Release Notes','showReleaseNotes()','primary')}</div></div>`}

center"><div class="bigicon">↝</div><h2>${s.tripKm.toFixed(1)} km</h2>${btn(s.trip?'Fahrt stoppen':'Fahrt starten',`s.trip=!s.trip;render()`,'primary')}${btn('Demo +1,2 km',`s.tripKm+=1.2;render()`)}</div>`;if(s.app==='calculator')return calcHTML();if(s.app==='speed')return gpsDashboard();if(s.app==='clock')return '<div class="center" style="width:100%;height:100%;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1.5vh,14px);overflow:hidden"><div class="bigicon" style="font-size:clamp(20px,5vh,42px)">🕒</div><div id="mevicarClockTime" style="font-size:clamp(30px,9vh,76px);font-weight:750;letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1.05">--:--:--</div><div id="mevicarClockDate" style="font-size:clamp(12px,2.7vh,22px);text-align:center">Datum wird geladen</div><div id="mevicarClockWeek" class="small">Kalenderwoche</div></div>';if(s.app==='settings')return settingsHTML();if(s.app==='stocks')return `<div class="center"><div class="bigicon">↗</div><h2>${s.stock}</h2><div style="font-size:26px">${s.stock==='Siemens'?'228,40 €':s.stock==='Tesla'?'312,65 $':'198,20 $'}</div><div class="controls">${['Siemens','Tesla','NVIDIA'].map(x=>btn(x,`s.stock='${x}';render()`,s.stock===x?'active':'')).join('')}</div><div class="small">Simulierte Kurse</div></div>`;if(s.app==='phone')return `<div class="center"><div class="bigicon">☎</div><h2>Telefon</h2>${btn('Testanruf simulieren','startCall()','primary')}</div>`;const labels={speed:'82 km/h · 2.150 U/min',weather:'4 °C · Leicht bewölkt',obd:'82 km/h · 2.150 U/min',whatsapp:'Keine neuen Nachrichten',youtube:'Videobereich · Demo',teams:'Keine Besprechung',calendar:'09:30 · Teammeeting'};return `<div class="center"><div class="bigicon">${info(s.app)[2]}</div><h2>${info(s.app)[1]}</h2><div>${labels[s.app]||'Demo-Ansicht'}</div></div>`}

function appVector(id){return '<svg viewBox="0 0 120 120" aria-hidden="true" focusable="false" class="app-illustration"><g class="app-art">'+(APP_VECTORS[id]||APP_VECTORS.settings)+'</g></svg>'}function appLauncherHTML(){return '<div class="app-home"><div class="app-home-heading">DEIN COCKPIT <span>MEVICAR NEXT</span></div><div class="app-home-grid">'+extras.map(([id,name])=>'<button type="button" class="app-home-tile app-'+id+'" aria-label="'+esc(name)+' öffnen" onclick="launch(\''+id+'\')"><span class="app-home-icon">'+appVector(id)+'</span><span class="app-home-label">'+esc(name)+'</span></button>').join('')+'</div></div>'}const DOCK_COLORS={"nav":"#18dcf6","audio":"#ff46d1","phone":"#24e9f3","speed":"#21e3ff","apps":"#b08bff","weather":"#ffe46a","ha":"#9c8dff","obd":"#27e5ec","whatsapp":"#52f494","youtube":"#ff7489","teams":"#a48fff","trips":"#5ce7e8","calendar":"#fa58d1","stocks":"#67f1ad","calculator":"#5ee7fe","clock":"#a28aff","settings":"#bb95ff"};
function dockIconId(id){return id==='slot'?(s.extra||'apps'):id}
function toolIcon(id,label){return '<span class="toolbar-icon" aria-hidden="true">'+appVector(id)+'</span><span class="tool-label">'+esc(label)+'</span>'}
function render(){document.documentElement.dataset.theme=s.theme;const dockTabs=[...fixed,['slot',s.extra?info(s.extra)[1]:'Zusatz',s.extra?info(s.extra)[2]:'＋'],['apps','Apps','▦']];$('dock').innerHTML=dockTabs.map(([id,name])=>{const glyph=dockIconId(id),selected=(extras.some(x=>x[0]===s.app)?'slot':s.app)===id;return `<button type="button" class="${selected?'active':''}" data-app="${glyph}" style="--dock-accent:${DOCK_COLORS[glyph]||'#8beaff'}" onclick="openApp('${id}')" aria-label="${esc(name)} öffnen" aria-pressed="${selected}"><span class="ico">${appVector(glyph)}</span><span class="dock-label">${esc(name)}</span></button>`}).join('');$('dock').className='dock '+s.dock;$('cockpit').className='cockpit '+(s.dock==='bottom'?'bottom':'');if(s.dock==='bottom')$('cockpit').appendChild($('dock'));else $('body').insertBefore($('dock'),$('body').firstChild);$('leftBtn').classList.toggle('active',s.dock==='left');$('bottomBtn').classList.toggle('active',s.dock==='bottom');if(s.app==='nav'&&!s.route)s.mode='map';let html;if(s.app==='apps'&&s.mode==='full')html='<div class="full app-home-surface">'+appLauncherHTML()+'</div>';else if(s.app!=='nav'&&s.mode==='full')html=`<div class="full"><div class="row"><h3>${info(s.app)[1].toUpperCase()}</h3></div>${appBody()}</div>`;else html=mapHTML()+(s.mode==='split'?`<aside class="side ${s.app==='apps'?'app-home-side':''}"><div class="row"><h3>${info(s.app)[1].toUpperCase()}</h3></div>${s.app==='apps'?appLauncherHTML():s.app==='nav'?`<div class="center"><h2>Navigation läuft</h2><div>${esc(s.destination)}</div>${btn('Zusatz-App öffnen',`openApp('apps')`)}${btn('Route beenden','stopRoute()')}</div>`:appBody()}</aside>`:'');$('screen').innerHTML=html;gpsRefresh();$('statusline').textContent=`${s.route?'Route aktiv – Split-Screen optional':'Keine Route – Apps im Split-Screen'} · ${s.nav==='search'?'Adresseingabe':s.nav==='preview'?'Routenvorschau':s.nav==='driving'?'Routenführung':'Kartenübersicht'} · Offline-Demo ohne echte GPS- oder Kartendaten`}
const CURRENT_BUILD=__MEVICAR_BUILD__;const RELEASE_NOTES=[['Einheitliche Symbolleiste','SVG-Symbole aus der Classic-inspirierten App-Übersicht jetzt auch im Dock, einschließlich Navi, Audio, Telefon, Tacho, Apps und Zusatzslot. Einheitliche Status- und Aktionssymbole mit Design-abhängigen Aktivzuständen.'],['App-Übersicht','Große eigens gezeichnete Neon-Vektorsymbole ohne dominante Kachelrahmen; nutzt die gesamte Bildschirmhöhe und funktioniert auch im Split-Screen.'],['Design-Themes','Drei live umschaltbare Oberflächen: Original, Cyberpunk Neon City und Liquid Glass; Auswahl wird lokal gespeichert.'],['0.1.0','Erster Prototyp-Meilenstein; Produktversion und Buildnummer getrennt; Update-Button mit Versionsprüfung; Release Notes in den Einstellungen; Apps starten im Vollbild; erneutes Antippen des Dock-Buttons schaltet in Split-Screen und zurück.'],['2.4.1','Cockpit Lab mit Navigation, Suchoverlay, Split-Screen, App-Dock und Demo-Apps.'],['Rechner','Funktionsfähiger Taschenrechner unter Apps mit Grundrechenarten, Prozent, Vorzeichen und Löschen.'],['Tacho','GPS-Tacho bis 220 km/h mit Standortfreigabe, Genauigkeit, Höhe und Kompasssensor im Vollbild und Split-Screen.'],['Uhr','Neue Uhr-App unter Apps mit Live-Uhrzeit, Datum und Kalenderwoche; im Vollbild und Split-Screen ohne Scrollen.'],['Windows-Vollbild','Vollbild-Schaltfläche für Windows und unterstützte Browser; automatischer echter Kioskstart über Edge-Verknüpfung möglich.'],['PWA-Vollbild','Start über das Home-Bildschirm-Symbol im Standalone-Modus ohne Browser-Chrome; optimierte Safe-Area-Anzeige.'],['Touch-Optimierung','Verbesserte Touch-Reaktion auf dem iPhone durch Entfernung der globalen Wischsperre.']];function showReleaseNotes(){const panel=document.createElement('div');panel.id='releaseNotesModal';panel.setAttribute('role','dialog');panel.setAttribute('aria-label','Release Notes');panel.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:18px';const notes=RELEASE_NOTES.map(([v,desc])=>'<div style="margin:12px 0"><strong>'+v+'</strong><div style="margin-top:4px;color:#c6dce5">'+desc+'</div></div>').join('');panel.innerHTML='<section style="width:min(540px,95vw);max-height:85vh;overflow:auto;background:#101f2b;border:1px solid #36839b;border-radius:16px;padding:20px;color:white;font:14px system-ui"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h2 style="margin:0">📋 Release Notes</h2><button id="closeReleaseNotes" style="padding:9px 14px">'+toolIcon('close','Schließen')+'</button></div><p>Installierte Version: v'+CURRENT_BUILD.version+' · Build '+CURRENT_BUILD.build+'</p>'+notes+'</section>';document.body.appendChild(panel);panel.querySelector('#closeReleaseNotes').onclick=()=>panel.remove();panel.addEventListener('click',e=>{if(e.target===panel)panel.remove()})}async function toggleFullscreen(){try{if(document.fullscreenElement){await document.exitFullscreen()}else{await document.documentElement.requestFullscreen()}}catch(e){alert('Vollbild wurde vom Browser blockiert. Unter Windows kannst du F11 verwenden oder Edge im Kioskmodus starten.')}syncFullscreenButton()}function syncFullscreenButton(){const b=document.getElementById('fullscreenBtn');if(!b)return;const full=!!document.fullscreenElement;b.innerHTML=toolIcon(full?'fullscreenExit':'fullscreen',full?'Beenden':'Vollbild');b.title=full?'Vollbild beenden':'Vollbild einschalten';b.setAttribute('aria-label',b.title)}document.addEventListener('fullscreenchange',syncFullscreenButton);function initToolbarIcons(){const u=$('updateBtn');if(u)u.innerHTML=toolIcon('update','Update');const g=$('gpsSignalIcon');if(g)g.innerHTML=appVector('gps');const l=$('cellSignalIcon');if(l)l.innerHTML=appVector('lte');syncFullscreenButton()}
function initBuild(){const e=$('buildVersion');if(e)e.textContent='v'+CURRENT_BUILD.version+' · Build '+CURRENT_BUILD.build;fetch('./build-info.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(info=>{if(info&&e)e.textContent='v'+info.version+' · Build '+info.build}).catch(()=>{})}async function checkForUpdate(){const b=$('updateBtn'),m=$('updateMessage');if(b){b.disabled=true;b.classList.add('checking')}if(m)m.textContent='Prüfe …';try{const res=await fetch('./build-info.json?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const latest=await res.json();if(latest.build!==CURRENT_BUILD.build){if(m)m.textContent='Update verfügbar';const url=new URL(location.href);url.searchParams.set('v',String(latest.build));location.replace(url.href);return}if(m)m.textContent='Aktuell'}catch(e){if(m)m.textContent='Prüfung fehlgeschlagen'}finally{if(b){b.disabled=false;b.classList.remove('checking')}}}function updateClock(){const now=new Date(),t=document.getElementById('mevicarClockTime'),d=document.getElementById('mevicarClockDate'),w=document.getElementById('mevicarClockWeek');const statusTime=$('statusClock');if(statusTime)statusTime.textContent=new Intl.DateTimeFormat('de-DE',{hour:'2-digit',minute:'2-digit'}).format(now);if(!t)return;t.textContent=new Intl.DateTimeFormat('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(now);d.textContent=new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(now);const u=new Date(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()));u.setUTCDate(u.getUTCDate()+4-(u.getUTCDay()||7));const y=new Date(Date.UTC(u.getUTCFullYear(),0,1));w.textContent='KW '+Math.ceil((((u-y)/86400000)+1)/7)}setInterval(updateClock,1000);setTimeout(updateClock,0);render();initBuild();initToolbarIcons();if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('PWA service worker:',err)))}
</script></body></html>
