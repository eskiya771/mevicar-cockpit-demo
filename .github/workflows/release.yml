name: Publish MeviCar Next Release

# A new product version, not every Pages build, creates one immutable Git tag
# and an official GitHub Release. The accompanying release notes must exist.
on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-versioned-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check production web regression gates before tagging
        run: |
          node --check stocks.js
          node --check homeassistant.js
          node tests/stocks-smoke.mjs
          node tests/launcher-landscape-smoke.mjs
          node tests/display-profiles-smoke.mjs
          node tests/navigation-google-smoke.mjs
          node tests/homeassistant-smoke.mjs
          node tests/youtube-smoke.mjs
          node tests/tv-smoke.mjs
          # Stable v0.6.0: protect recent Android/PWA interoperability
          node tests/version-smoke.mjs
          node tests/native-updates-smoke.mjs
          node tests/credential-native-pin-smoke.mjs
          node tests/first-run-maps-smoke.mjs
          node tests/spotify-android-smoke.mjs
          node tests/spotify-oauth-race-smoke.mjs
          node tests/tv-restore-smoke.mjs
          node tests/tv-iphone-landscape-smoke.mjs
          node tests/tacho-default-smoke.mjs
          node tests/tacho-next-live-smoke.mjs
      - name: Validate version, create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION: $version" >&2
            exit 1
          fi
          tag="v${version}"
          notes="RELEASE_NOTES_${tag}.md"
          test -s "$notes" || { echo "Missing release notes: $notes" >&2; exit 1; }
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists; no duplicate release."
            exit 0
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "MeviCar Next Web – Stable $tag" \
            --notes-file "$notes" \
            --latest
          gh release view "$tag" --json url,tagName,name
