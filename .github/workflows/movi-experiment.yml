name: Experimental Movi MKV WASM from source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/movi-experiment.yml'
      - 'patches/movi-seek.patch'
      - 'patches/movi-cues-fastseek.patch'

permissions:
  contents: read

jobs:
  build-movi:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - name: Fetch pinned Movi upstream source
        run: |
          git clone --filter=blob:none https://github.com/MrUjjwalG/movi-player.git movi-src
          cd movi-src
          git checkout 8bd0b50d7cdfcef635e015ea93e365876088969d
          git rev-parse HEAD
          grep -q 'movi_mkv_index_near_fmt' wasm/movi_streams.c
          grep -q 'movi_mkv_index_misses' wasm/movi_streams.c
          grep -q 'AVIO_SEEKABLE_NORMAL' wasm/movi.c
          git apply --check ../patches/movi-seek.patch
          git apply ../patches/movi-seek.patch
          git apply --check ../patches/movi-cues-fastseek.patch
          git apply ../patches/movi-cues-fastseek.patch
          grep -q 'Fast path for indexed Matroska' wasm/movi_streams.c
      - name: Prepare and test patched source
        run: |
          cd movi-src
          mkdir -p dist
          npm ci --ignore-scripts
          npm run typecheck
          npx vitest run src/demux/Demuxer.seek.test.ts src/source/HttpSource.size.test.ts
      - name: Build FFmpeg and Matroska seek demuxer to WebAssembly
        run: |
          cd movi-src
          docker compose run --rm build
          sudo chown -R "$(id -u):$(id -g)" dist
          test -s dist/wasm/external/movi.wasm
      - name: Build matching slim browser player
        run: |
          cd movi-src
          node scripts/check-wasm.js
          ./node_modules/.bin/tsc --emitDeclarationOnly
          MOVI_ENTRY=element.slim MOVI_FORMAT=iife MOVI_JOBS=1 MOVI_TERSER_PASSES=2 node scripts/build-standalone.js
          test -s dist/element.slim.global.js
          test -s dist/wasm/external/movi.wasm
      - name: Stage standalone WASM alongside browser bundle
        run: cp movi-src/dist/wasm/external/movi.wasm movi-src/dist/movi.wasm
      - name: Stamp traceable artifact
        env:
          MEVICAR_COMMIT: ${{ github.sha }}
        run: |
          cd movi-src
          sha256sum dist/movi.wasm dist/element.slim.global.js > dist/movi-experimental.sha256
          printf 'upstream=%s\n' "$(git rev-parse HEAD)" >> dist/movi-experimental.sha256
          printf 'mevicar=%s\n' "$MEVICAR_COMMIT" >> dist/movi-experimental.sha256
          printf 'patch_sha256=%s\n' "$(sha256sum ../patches/movi-seek.patch | cut -d' ' -f1)" >> dist/movi-experimental.sha256
      - name: Upload experimental binaries only
        uses: actions/upload-artifact@v4
        with:
          name: movi-mkv-experimental-source-build
          path: |
            movi-src/dist/movi.wasm
            movi-src/dist/element.slim.global.js
            movi-src/dist/movi-experimental.sha256
          retention-days: 14
          if-no-files-found: error
