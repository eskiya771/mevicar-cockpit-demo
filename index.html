ent('${encodeURIComponent(name)}'))"><span class="circle">${icon}</span><span><strong>${esc(name)}</strong><small>${esc(sub)}</small></span><span style="margin-left:auto">›</span></button>`}function resultsHTML(){const q=s.query.trim().toLocaleLowerCase('de');let items=q?places.filter(p=>p.join(' ').toLocaleLowerCase('de').includes(q)):places.slice(0,5);if(q&&!items.length)items=[[s.query,'Freie Zieleingabe · Demo']];return items.map(p=>placeButton(p[0],p[1])).join('')}function favHTML(){const icons=['⌂','▣','♜','▥'];return `<div class="favs">${s.favorites.map((f,i)=>`<button class="fav" onclick="selectPlace(decodeURIComponent('${encodeURIComponent(f)}'))"><span class="bubble">${icons[i%icons.length]}</span><span>${esc(f)}</span></button>`).join('')}</div>`}function keyboardHTML(){return `<div class="keyboard">${['QWERTZUIOP','ASDFGHJKL','YXCVBNM'].map(line=>`<div class="keyrow">${[...line].map(k=>btn(k,`key('${k}')`)).join('')}</div>`).join('')}<div class="keyrow">${btn('123',`key('1')`,'special')}${btn('Leerzeichen',`key('space')`,'special')}${btn('⌫',`key('back')`,'special')}${btn('Fertig',`hideKeyboard()`,'go')}</div></div>`}function browseOverlay(){return `<div class="overlay glass"><div class="inner"><button class="searchbox" style="text-align:left;width:100%" onclick="openSearch()"><span style="font-size:24px">⌕</span><span style="color:#d0e2e5;font-size:17px;flex:1">Apple-Karten-Stil · Suchen</span><span style="font-size:22px">🎙</span></button><div class="sectiontitle">Vorschläge</div>${placeButton(s.recents[0]||'Erlangen-Nord','Zuletzt angesehen','📍')}<div class="sectiontitle">Orte ›</div>${favHTML()}<div class="sectiontitle">Letzte Ziele</div><div class="list">${s.recents.map(n=>placeButton(n,'Zuletzt verwendet','◷')).join('')}</div></div></div>`}function searchOverlay(){return `<div class="overlay glass"><div class="inner"><div class="row"><b style="font-size:17px">Suchen</b>${btn('Abbrechen','backToBrowse()')}</div><div class="searchbox"><span style="fon document.addEventListener('keydown',e=>{if(s.nav!=='search'||s.app!=='nav'||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='Backspace'){e.preventDefault();key('back')}else if(e.key===' '){e.preventDefault();key('space')}else if(e.key.length===1){e.preventDefault();key(e.key)}else if(e.key==='Escape'){hideKeyboard()}else if(e.key==='Enter'&&s.query.trim()){selectPlace(s.query)}});function scrollResults(){if(s.keyboard){s.keyboard=false;const k=document.querySelector('.keyboard');if(k)k.remove();const m=document.querySelector('.map');m?.classList.remove('searchmode')}}function previewHTML(){return `<div class="preview glass"><div class="row"><b style="font-size:18px">${esc(s.destination)}</b>${btn('✕','backToBrowse()')}</div><span class="small">Routenvorschau · simulierte Zeiten</span>${[0,1].map((n)=>btn(`<span>${n===0?'Schnellste Route':'Alternative Route'}</span><b>${n===0?'24':'29'} Min.</b>`,`s.routeChoice=${n};render()`,`routeopt ${s.routeChoice===n?'active':''}`)).join('')}<div class="row">${btn(s.favorites.includes(s.destination)?'★ Gespeichert':'☆ Favorit','toggleFav()')}${btn('➤ Los','startRoute()','primary')}</div></div>`}function roads(){return `<svg class="roads" viewBox="0 0 1000 650" preserveAspectRatio="xMidYMid slice"><path class="park" d="M560 410L780 355 960 480 950 650 610 650Z"/><path class="park" d="M0 0L330 0 260 170 0 230Z"/><path class="water" d="M600 480L700 430 750 560 660 615Z"/><path class="street" d="M-50 180Q220 210 400 80T1100 120 M-20 360Q250 300 460 410T1100 350 M140 -20Q260 210 190 680 M430 -30Q500 280 590 700 M810 -30Q700 270 960 680"/><path class="street2" d="M-10 90L900 600 M70 650L700 -50 M320 650L900 -50 M0 500L1050 180 M300 -30L1000 450 M0 260L1000 480 M80 -30L580 680 M700 -20L1000 230"/>${s.nav==='preview'||s.nav==='driving'?'<path class="route" d="M710 375L640 345 570 420 455 360 330 390 250 265"/><circle class="pin" cx="250" cy="265" r="12"/>':''}</svg>`}function mapHTML(){const search=s.nav==='search',driving=s.nav==='driving';return `<div class="map ${search&&s.keyboard?'searchmode':''}">${roads()}<span class="map-label">Erlangen · Demo-Karte</span><div class="loc"></div><div class="map-tools">${btn('⌖','render()')}${btn('↗','render()')}</div><div class="map-weather">☾ 4°</div><div class="map-badge">◉ GPS · DEMO</div>${s.app==='nav'?(s.nav==='browse'?browseOverlay():search?searchOverlay():s.nav==='preview'?previewHTML():`<div class="navbanner"><div class="small">IN 850 M</div><strong>↱ Rechts abbiegen</strong><div>${esc(s.destination)}</div><div class="controls" style="margin-top:12px">${btn('Route beenden','stopRoute()')}${btn('Zusatzscreen','s.mode="split";render()','primary')}${btn('Neues Ziel','openSearch()')}</div></div>`):''}</div>`}
function appBody(){if(s.call!=='idle'&&s.app==='phone')return `<div class="center"><div class="bigicon">☎</div><h2>${s.call==='ring'?'Eingehender Anruf':'Anruf aktiv'}</h2><div>Demo-Anrufer</div><div class="controls">${s.call==='ring'?btn('✓ Annehmen',`s.call='active';render()`,'primary'):''}${btn('✕ Auflegen','endCall()')}</div></div>`;if(s.app==='audio')return `<div class="center"><div class="controls">${['radio','spotify','media'].map(x=>btn(x==='media'?'USB / Medien':x==='radio'?'Radio':'Spotify',`s.audio='${x}';s.playing=false;render()`,s.audio===x?'active':'')).join('')}</div><div class="bigicon">♫</div><h2>${s.audio==='radio'?esc(s.station):s.audio==='spotify'?'Spotify':'MeviMedia'}</h2><div class="controls">${btn('◀',`s.station='Mevi FM';render()`)}${btn(s.playing?'❚❚ Pause':'▶ Abspielen',`s.playing=!s.playing;render()`,'primary')}${btn('▶▶',`s.station='Rock Radio';render()`)}</div><div class="small">Demo: Quellenwechsel stoppt bisherige Wiedergabe</div></div>`;if(s.app==='ha')return `<div class="center"><div class="bigicon">⌂</div><h2>Home Assistant</h2>${btn(s.light?'Licht AN':'Licht AUS',`s.light=!s.light;render()`,'primary')}</div>`;if(s.app==='trips')return `<div class="center"><div class="bigicon">↝</div><h2>${s.tripKm.toFixed(1)} km</h2>${btn(s.trip?'Fahrt stoppen':'Fahrt starten',`s.trip=!s.trip;render()`,'primary')}${btn('Demo +1,2 km',`s.tripKm+=1.2;render()`)}</div>`;if(s.app==='calculator')return calcHTML();if(s.app==='settings')return `<div class="center"><div class="bigicon">⚙</div><h2>Settings</h2><div>Version: ${CURRENT_BUILD.version}</div><div>Design: ${s.theme}</div>${btn('Design wechseln',`s.theme=s.theme==='Neon'?'Klassisch':'Neon';render()`)}${btn('📋 Release Notes','showReleaseNotes()','primary')}<div class="small">Demo-Einstellungen</div></div>`;if(s.app==='stocks')return `<div class="center"><div class="bigicon">↗</div><h2>${s.stock}</h2><div style="font-size:26px">${s.stock==='Siemens'?'228,40 €':s.stock==='Tesla'?'312,65 $':'198,20 $'}</div><div class="controls">${['Siemens','Tesla','NVIDIA'].map(x=>btn(x,`s.stock='${x}';render()`,s.stock===x?'active':'')).join('')}</div><div class="small">Simulierte Kurse</div></div>`;if(s.app==='phone')return `<div class="center"><div class="bigicon">☎</div><h2>Telefon</h2>${btn('Testanruf simulieren','startCall()','primary')}</div>`;const labels={speed:'82 km/h · 2.150 U/min',weather:'4 °C · Leicht bewölkt',obd:'82 km/h · 2.150 U/min',whatsapp:'Keine neuen Nachrichten',youtube:'Videobereich · Demo',teams:'Keine Besprechung',calendar:'09:30 · Teammeeting'};return `<div class="center"><div class="bigicon">${info(s.app)[2]}</div><h2>${info(s.app)[1]}</h2><div>${labels[s.app]||'Demo-Ansicht'}</div></div>`}
function render(){const dockTabs=[...fixed,['slot',s.extra?info(s.extra)[1]:'Zusatz',s.extra?info(s.extra)[2]:'＋'],['apps','Apps','▦']];$('dock').innerHTML=dockTabs.map(([id,name,icon])=>`<button class="${(extras.some(x=>x[0]===s.app)?'slot':s.app)===id?'active':''}" onclick="openApp('${id}')"><span class="ico">${icon}</span><span>${esc(name)}</span></button>`).join('');$('dock').className='dock '+s.dock;$('cockpit').className='cockpit '+(s.dock==='bottom'?'bottom':'');if(s.dock==='bottom')$('cockpit').appendChild($('dock'));else $('body').insertBefore($('dock'),$('body').firstChild);$('leftBtn').classList.toggle('active',s.dock==='left');$('bottomBtn').classList.toggle('active',s.dock==='bottom');if(s.app==='nav'&&!s.route)s.mode='map';let html;if(s.app==='apps'&&s.mode==='full')html=`<div class="full"><h3>ZUSATZ-APPS</h3><div class="grid">${extras.map(([id,name,icon])=>`<button onclick="launch('${id}')"><span class="bigicon">${icon}</span>${esc(name)}</button>`).join('')}</div></div>`;else if(s.app!=='nav'&&s.mode==='full')html=`<div class="full"><div class="row"><h3>${info(s.app)[1].toUpperCase()}</h3></div>${appBody()}</div>`;else html=mapHTML()+(s.mode==='split'?`<aside class="side"><div class="row"><h3>${info(s.app)[1].toUpperCase()}</h3></div>${s.app==='apps'?`<div class="grid">${extras.map(([id,name,icon])=>`<button onclick="launch('${id}')"><span class="bigicon">${icon}</span>${esc(name)}</button>`).join('')}</div>`:s.app==='nav'?`<div class="center"><h2>Navigation läuft</h2><div>${esc(s.destination)}</div>${btn('Zusatz-App öffnen',`openApp('apps')`)}${btn('Route beenden','stopRoute()')}</div>`:appBody()}</aside>`:'');$('screen').innerHTML=html;$('statusline').textContent=`${s.route?'Route aktiv – Split-Screen optional':'Keine Route – Apps im Split-Screen'} · ${s.nav==='search'?'Adresseingabe':s.nav==='preview'?'Routenvorschau':s.nav==='driving'?'Routenführung':'Kartenübersicht'} · Offline-Demo ohne echte GPS- oder Kartendaten`}
const CURRENT_BUILD=__MEVICAR_BUILD__;const RELEASE_NOTES=[['2.4.x','Automatische Versionsnummer bei jeder Veröffentlichung; Update-Button mit Versionsprüfung; Release Notes in den Einstellungen; Apps starten im Vollbild; erneutes Antippen des Dock-Buttons schaltet in Split-Screen und zurück.'],['2.4.1','Cockpit Lab mit Navigation, Suchoverlay, Split-Screen, App-Dock und Demo-Apps.'],['Rechner','Funktionsfähiger Taschenrechner unter Apps mit Grundrechenarten, Prozent, Vorzeichen und Löschen.'],['Touch-Optimierung','Verbesserte Touch-Reaktion auf dem iPhone durch Entfernung der globalen Wischsperre.']];function showReleaseNotes(){const panel=document.createElement('div');panel.id='releaseNotesModal';panel.setAttribute('role','dialog');panel.setAttribute('aria-label','Release Notes');panel.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:18px';const notes=RELEASE_NOTES.map(([v,desc])=>'<div style="margin:12px 0"><strong>'+v+'</strong><div style="margin-top:4px;color:#c6dce5">'+desc+'</div></div>').join('');panel.innerHTML='<section style="width:min(540px,95vw);max-height:85vh;overflow:auto;background:#101f2b;border:1px solid #36839b;border-radius:16px;padding:20px;color:white;font:14px system-ui"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h2 style="margin:0">📋 Release Notes</h2><button id="closeReleaseNotes" style="padding:9px 14px">✕ Schließen</button></div><p>Installierte Version: '+CURRENT_BUILD.version+'</p>'+notes+'</section>';document.body.appendChild(panel);panel.querySelector('#closeReleaseNotes').onclick=()=>panel.remove();panel.addEventListener('click',e=>{if(e.target===panel)panel.remove()})}function initBuild(){const e=$('buildVersion');if(e)e.textContent=CURRENT_BUILD.version}async function checkForUpdate(){const b=$('updateBtn'),m=$('updateMessage');if(b)b.disabled=true;if(m)m.textContent='Prüfe …';try{const res=await fetch('./build-info.json?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const latest=await res.json();if(latest.build!==CURRENT_BUILD.build){if(m)m.textContent='Update verfügbar';const url=new URL(location.href);url.searchParams.set('v',String(latest.build));location.replace(url.href);return}if(m)m.textContent='Aktuell'}catch(e){if(m)m.textContent='Prüfung fehlgeschlagen'}finally{if(b)b.disabled=false}}render();initBuild();
</script></body></html>
